
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Xblox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #xplay {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      background: #000;
      font: 15px Arial, sans-serif;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Xblox...</div>

  <iframe
    id="xplay"
    src="/proxy/"
    allow="autoplay; fullscreen; clipboard-write"
    allowfullscreen
    onload="document.getElementById('loading').style.display='none'">
  </iframe>
</body>
</html>
