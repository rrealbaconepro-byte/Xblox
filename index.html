<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101116">
<title>Xbox WebPlayer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101116;color:#f4f5f7;font-family:system-ui,Arial,sans-serif}
main{max-width:1440px;margin:auto;padding:16px}.bar,footer{display:flex;align-items:center;gap:10px;color:#aeb5c2;font-size:13px}
.bar{height:44px;border-bottom:1px solid #303542}.grow{flex:1}.dot{width:8px;height:8px;border-radius:50%;background:#d5a84c}
.frame{position:relative;width:100%;height:78vh;min-height:420px;margin-top:16px;overflow:hidden;border:1px solid #303542;border-radius:9px;background:#050609}
iframe{display:block;width:100%;height:100%;border:0;background:#050609}
.notice{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:#080a0f}
.notice[hidden]{display:none}.notice p{max-width:600px;color:#aeb5c2;line-height:1.5}
button,a{padding:10px 15px;border:1px solid #444b5a;border-radius:7px;background:#202532;color:white;text-decoration:none;cursor:pointer;font:inherit}
footer{justify-content:space-between;flex-wrap:wrap;padding:14px 2px}
@media(max-width:650px){main{padding:8px}.frame{height:72vh;min-height:360px}}
</style>
</head>
<body>
<main>
<header class="bar"><span class="dot" id="dot"></span><strong>WEB PLAYER</strong><span class="grow"></span><span id="connection">Connecting…</span></header>
<section class="frame" aria-label="Game player">
<iframe id="player" title="Game player" src="/proxy/" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen loading="eager"></iframe>
<div class="notice" id="notice">
<strong id="heading">Starting player…</strong>
<p id="message">Connecting to the upstream player.</p>
<button id="retry" type="button">Reload player</button>
<a href="/proxy/" target="_blank" rel="noopener">Open player separately</a>
</div>
</section>
<footer><span>Keyboard and controller support depend on the upstream player.</span><span id="host">Checking host…</span></footer>
</main>
<script>
(() => {
 const frame=document.getElementById('player'), notice=document.getElementById('notice');
 const heading=document.getElementById('heading'), message=document.getElementById('message');
 const connection=document.getElementById('connection'), dot=document.getElementById('dot');
 let timer;
 function begin(){
  clearTimeout(timer); notice.hidden=false; heading.textContent='Starting player…';
  message.textContent='Waiting for the upstream player page.';
  connection.textContent='Loading player'; dot.style.background='#d5a84c';
  timer=setTimeout(()=>{
   heading.textContent='Player is taking too long';
   message.textContent='The host is reachable, but the game has not confirmed startup. Check Render logs for failed scripts, missing assets, relay/WebSocket errors, or upstream domain authorization.';
   connection.textContent='Player not confirmed'; dot.style.background='#d58b55';
  },15000);
 }
 frame.addEventListener('load',()=>{
  clearTimeout(timer); heading.textContent='Player page loaded';
  message.textContent='If the game area is empty, the problem is likely inside the upstream page, its scripts/assets, relay connection, or provider authorization.';
  connection.textContent='Frame loaded'; dot.style.background='#79bd91';
 });
 document.getElementById('retry').addEventListener('click',()=>{
  begin(); frame.src='/proxy/?refresh='+Date.now();
 });
 fetch('/health',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();})
  .then(()=>document.getElementById('host').textContent='Host server: online')
  .catch(e=>document.getElementById('host').textContent='Host server: '+e.message);
 begin();
})();
</script>
</body>
</html>
