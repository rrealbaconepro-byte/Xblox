<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Xbox WebPlayer</title>
<style>
:root{--bg:#0b0d0c;--panel:#171a18;--panel-2:#202421;--text:#f2f4f2;--muted:#9aa39c;--accent:#107c10;--accent-2:#52b043;--a:#3fa33a;--b:#d13438;--x:#2d7dd2;--y:#e8b100}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--text);font:16px/1.4 "Segoe UI","Source Sans Pro",system-ui,sans-serif;overflow:hidden}
#canvas{display:block;width:100vw;height:100vh;object-fit:contain;background:#000;outline:0;cursor:none}
#boot{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;font-family:"Source Sans Pro",system-ui,sans-serif}
#boot[hidden]{display:none}
#wait{font-size:20px;letter-spacing:.5px}
body.failed #wait{display:none}
#bar{width:min(320px,70vw);height:3px;background:#222;overflow:hidden;visibility:hidden}
body.downloading #bar{visibility:visible}
#bar>div{height:100%;width:0;background:#fff;transition:width .2s}
body.failed #bar{display:none}
#status{display:none}
#error{color:#f77;white-space:pre-wrap;text-align:center;max-width:80vw;padding:0 18px}
#error a{color:#fff}
kbd{font:600 12px/1 inherit;padding:4px 7px;border-radius:4px;background:var(--panel-2);color:var(--text);border:1px solid #333a35}
.btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font:700 12px/1 inherit;color:#111}
.btn.a{background:var(--a)}.btn.b{background:var(--b)}.btn.x{background:var(--x)}.btn.y{background:var(--y)}
.btn.bumper{width:auto;padding:0 7px;border-radius:6px;background:#d8dcd9}
#keyboard{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}
#keyboard[hidden]{display:none}
#kb-panel{width:min(760px,94vw);background:var(--panel);border-top:4px solid var(--accent);padding:22px 24px 18px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
#kb-title{font-size:22px;font-weight:600}
#kb-description{color:var(--muted);margin-top:2px;min-height:1.2em}
#kb-input{display:block;width:100%;margin:14px 0 16px;padding:12px 14px;font:20px/1.2 inherit;color:var(--text);background:#0f1110;border:2px solid #313733;border-radius:2px;outline:0}
#kb-input:focus{border-color:var(--accent-2)}
#kb-keys{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
#kb-keys button{height:46px;font:600 18px/1 inherit;color:var(--text);background:var(--panel-2);border:2px solid transparent;border-radius:2px;cursor:pointer}
#kb-keys button.wide2{grid-column:span 2;font-size:15px}
#kb-keys button.wide4{grid-column:span 4;font-size:15px}
#kb-keys button.on{background:var(--accent)}
#kb-keys button.focus{border-color:#fff;background:#2d332f}
#kb-keys button.on.focus{background:var(--accent-2)}
#kb-hints{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;color:var(--muted);font-size:13px}
#kb-hints div{display:flex;align-items:center;gap:6px}
#toast{position:fixed;z-index:15;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:3px;background:rgba(23,26,24,.92);font-size:14px;pointer-events:none;transition:opacity .3s}
#toast[hidden]{display:block;opacity:0}

/* On-device diagnostic panel */
#debug-toggle{position:fixed;z-index:30;right:12px;top:12px;border:1px solid #59635b;border-radius:7px;padding:10px 13px;background:#202720;color:#fff;font:600 14px system-ui;cursor:pointer}
#debug-panel{position:fixed;z-index:29;top:58px;right:10px;width:min(440px,calc(100vw - 20px));max-height:72vh;overflow:auto;background:#101512;border:1px solid #465149;border-radius:9px;padding:14px;box-shadow:0 12px 36px #000b;color:#e9eee9;font:13px/1.45 ui-monospace,SFMono-Regular,monospace}
#debug-panel[hidden]{display:none}
#debug-panel h2{font:600 16px system-ui;margin:0 0 10px}
#debug-panel .actions{display:flex;gap:8px;margin:10px 0}
#debug-panel button{background:#29332c;color:#fff;border:1px solid #536057;border-radius:5px;padding:8px 10px;font:600 13px system-ui}
#debug-results{display:grid;grid-template-columns:1fr auto;gap:6px 12px}
#debug-results .value{color:#b8e6ae;text-align:right;overflow-wrap:anywhere}
#debug-results .bad{color:#ff9b9b}
#debug-log{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #39433c;margin-top:12px;padding-top:10px;color:#c7d0c8}
@media(max-width:600px){#kb-panel{padding:16px}#kb-keys{gap:4px}#kb-keys button{height:40px;font-size:15px}}
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>

<div id="boot">
  <div id="wait">Please wait...</div>
  <div id="bar"><div></div></div>
  <div id="status"></div>
  <div id="error"></div>
</div>

<div id="keyboard" hidden>
  <div id="kb-panel" role="dialog" aria-labelledby="kb-title">
    <div id="kb-title"></div>
    <div id="kb-description"></div>
    <input id="kb-input" autocomplete="off" spellcheck="false">
    <div id="kb-keys"></div>
    <div id="kb-hints">
      <div><span class="btn a">A</span> type</div>
      <div><span class="btn b">B</span> cancel</div>
      <div><span class="btn x">X</span> backspace</div>
      <div><span class="btn y">Y</span> space</div>
      <div><span class="btn bumper">Menu</span><kbd>Enter</kbd> done</div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<button id="debug-toggle" type="button" aria-expanded="false">Debug</button>
<section id="debug-panel" hidden aria-label="Player diagnostics">
  <h2>Xblox player diagnostics</h2>
  <div id="debug-results"></div>
  <div class="actions">
    <button id="debug-refresh" type="button">Refresh checks</button>
    <button id="debug-clear" type="button">Clear log</button>
  </div>
  <div id="debug-log">Starting diagnostics…</div>
</section>

<script>
(() => {
  "use strict";
  const panel = document.getElementById("debug-panel");
  const toggle = document.getElementById("debug-toggle");
  const results = document.getElementById("debug-results");
  const logBox = document.getElementById("debug-log");
  const logLines = [];
  const scriptStates = {};
  const scriptNames = ["player-cache.js", "console.js", "RobloxPlayerWeb.js"];

  function log(message) {
    const line = new Date().toLocaleTimeString() + " " + String(message);
    logLines.push(line);
    if (logLines.length > 80) logLines.shift();
    logBox.textContent = logLines.join("\n");
  }

  function value(label, val, good) {
    const a = document.createElement("div");
    const b = document.createElement("div");
    a.textContent = label;
    b.textContent = val;
    b.className = "value" + (good === false ? " bad" : "");
    results.append(a, b);
  }

  function checkScript(name) {
    const scripts = Array.from(document.scripts);
    const script = scripts.find(s => (s.getAttribute("src") || "").includes(name));
    if (!script) return "not included";
    return scriptStates[name] || "loading / status unknown";
  }

  async function checkConsoleData() {
    try {
      const response = await fetch("/RobloxConsole.data.js", {
        method: "HEAD",
        cache: "no-store",
        credentials: "same-origin"
      });
      return response.status + " " + (response.ok ? "reachable" : response.statusText);
    } catch (error) {
      return "request failed: " + error.message;
    }
  }

  async function refresh() {
    results.replaceChildren();
    value("HTTPS / secure context", String(window.isSecureContext), window.isSecureContext);
    value("Cross-origin isolated", String(window.crossOriginIsolated), window.crossOriginIsolated);
    value("SharedArrayBuffer", typeof window.SharedArrayBuffer,
      typeof window.SharedArrayBuffer === "function");
    value("Canvas element", String(!!document.getElementById("canvas")),
      !!document.getElementById("canvas"));
    value("player-cache.js", checkScript("player-cache.js"));
    value("console.js", checkScript("console.js"));
    value("RobloxPlayerWeb.js", checkScript("RobloxPlayerWeb.js"));
    value("Module global", typeof window.Module);
    value("RobloxConsole data", "checking…");
    const dataStatus = await checkConsoleData();
    value("RobloxConsole.data.js", dataStatus, dataStatus.startsWith("200"));
    log("Diagnostics refreshed.");
  }

  toggle.addEventListener("click", () => {
    panel.hidden = !panel.hidden;
    toggle.setAttribute("aria-expanded", String(!panel.hidden));
    if (!panel.hidden) refresh();
  });
  document.getElementById("debug-refresh").addEventListener("click", refresh);
  document.getElementById("debug-clear").addEventListener("click", () => {
    logLines.length = 0;
    logBox.textContent = "";
  });

  window.addEventListener("error", event => {
    if (event.target && event.target !== window) {
      const resource = event.target.src || event.target.href || event.target.tagName;
      log("RESOURCE ERROR: " + resource);
    } else {
      log("JS ERROR: " + (event.message || "Unknown error") +
        (event.filename ? " (" + event.filename + ":" + event.lineno + ")" : ""));
    }
  }, true);

  window.addEventListener("unhandledrejection", event => {
    const reason = event.reason;
    log("PROMISE ERROR: " + (reason && reason.message ? reason.message : String(reason)));
  });

  scriptNames.forEach(name => {
    const script = Array.from(document.scripts).find(s =>
      (s.getAttribute("src") || "").includes(name));
    if (!script) {
      scriptStates[name] = "not included";
      return;
    }
    script.addEventListener("load", () => {
      scriptStates[name] = "loaded";
      log("Loaded " + name);
    });
    script.addEventListener("error", () => {
      scriptStates[name] = "FAILED to load";
      log("FAILED to load " + name);
    });
  });

  log("Debug panel ready. Tap Refresh checks for current results.");
  refresh();
})();
</script>

<!-- Keep all project files in the repository root. -->
<script src="/player-cache.js"></script>
<script src="/console.js"></script>
<script src="/RobloxPlayerWeb.js"></script>
</body>
</html>
