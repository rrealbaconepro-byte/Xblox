<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XPlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- 
    Option 1 (default): load the site directly 
    Option 2: use the proxy → change src to "/proxy/"
  -->
  <iframe 
    src="https://xplay.better16.wtf/" 
    allowfullscreen
    allow="autoplay; fullscreen; clipboard-write"
  ></iframe>
</body>
</html>
